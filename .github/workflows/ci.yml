name: CI

on:
  push:
    branches: [main, eval/cursor]
  pull_request:
    branches: [main, eval/cursor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs:
    name: Next.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        # Version comes from package.json "packageManager" (single source of truth).

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # PR #363 deleted package-lock.json without an npm lockfile; this repo
      # resolves deps via pnpm-lock.yaml. Fail fast if the wrong lockfile returns.
      - name: Assert pnpm lockfile (no npm package-lock)
        run: |
          test -f pnpm-lock.yaml
          if [ -f package-lock.json ]; then
            echo "package-lock.json must not exist; use pnpm-lock.yaml" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Prisma seed
        run: pnpm exec prisma db seed --schema prisma/schema.prisma

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
