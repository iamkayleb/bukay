name: Create New PR from Verification

# Creates a follow-up issue from verification feedback, then
# triggers auto-pilot to prepare a new PR.
#
# Trigger: Add `verify:create-new-pr` label to a merged PR

on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  models: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: >-
    agents-verify-to-new-pr-${{ github.repository }}-${{
      github.event.pull_request.number || github.run_id
    }}
  cancel-in-progress: false

jobs:
  create-new-pr:
    if: github.event.label.name == 'verify:create-new-pr'
    runs-on: ubuntu-latest
    env:
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
    steps:
      - name: Check PR is merged
        id: check-merged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr.merged) {
              core.setFailed('PR must be merged before creating follow-up issue');
              return;
            }
            core.setOutput('merged', 'true');
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_title', pr.title);

      - name: Mint GitHub App token
        id: app_token
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          env.WORKFLOWS_APP_ID != '' && env.WORKFLOWS_APP_PRIVATE_KEY != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Select GitHub token
        id: select-token
        if: steps.check-merged.outputs.merged == 'true'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER_PR_PAT: ${{ secrets.OWNER_PR_PAT }}
          SERVICE_BOT_PAT: ${{ secrets.SERVICE_BOT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Prefer an App installation token. Issues and labels created with
          # GITHUB_TOKEN raise no events for other workflows (GitHub's loop
          # guard), so a follow-up issue created that way is never picked up by
          # auto-pilot and waits until a human re-applies its label by hand.
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=workflows-app" >> "$GITHUB_OUTPUT"
          elif [ -n "$OWNER_PR_PAT" ]; then
            echo "token=$OWNER_PR_PAT" >> "$GITHUB_OUTPUT"
            echo "source=owner-pat" >> "$GITHUB_OUTPUT"
          elif [ -n "$SERVICE_BOT_PAT" ]; then
            echo "token=$SERVICE_BOT_PAT" >> "$GITHUB_OUTPUT"
            echo "source=service-bot" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No App token or PAT; using GITHUB_TOKEN."
            echo "::warning::The follow-up issue will NOT trigger auto-pilot."
            echo "::warning::Set WORKFLOWS_APP_ID + _PRIVATE_KEY, or SERVICE_BOT_PAT."
            echo "token=$GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=github-token" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-merged.outputs.merged == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iamkayleb/Workflows
          token: ${{ steps.select-token.outputs.token }}
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/agents/registry.yml
            .github/scripts/agent_registry.js
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/terminal_disposition.js
            .github/scripts/token_load_balancer.js
            config
            scripts/langchain
            tools
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Set up Python
        if: steps.check-merged.outputs.merged == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check-merged.outputs.merged == 'true'
        run: |
          pip install langchain langchain-openai langchain-anthropic requests

      - name: Collect verification and original issue data
        id: collect
        if: steps.check-merged.outputs.merged == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry, paginateWithRetry } = retryHelpers;
            const prNumber = context.payload.pull_request.number;

            // Get all PR comments (handle pagination)
            const comments = await paginateWithRetry(
              github, github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            // Find verification comment(s) - both evaluate and compare
            const verifyComments = comments.filter(c =>
              c.body.includes('## PR Verification Report') ||
              c.body.includes('## PR Verification Comparison') ||
              c.body.includes('### Concerns') ||
              c.body.includes('Verdict:') ||
              c.body.includes('### ⚠️ Issues Detected')
            );

            if (verifyComments.length === 0) {
              core.setFailed(
                'No verification comment found. ' +
                'Add verify:evaluate or verify:compare label first.'
              );
              return;
            }

            // Combine all verification comments
            const verificationText = verifyComments.map(c => c.body).join('\n\n---\n\n');
            fs.writeFileSync('verification_data.txt', verificationText);
            core.info(`Found ${verifyComments.length} verification comment(s)`);

            // Extract linked issue from PR body
            const prBody = context.payload.pull_request.body || '';
            const issueMatches = prBody.match(
              /(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/gi
            );
            let linkedIssueNumber = null;

            if (issueMatches) {
              const match = issueMatches[0].match(/#(\d+)/);
              if (match) {
                linkedIssueNumber = parseInt(match[1]);
              }
            }

            // Also check PR preamble for "Source: Issue #NNN" pattern
            if (!linkedIssueNumber) {
              const sourceMatch = prBody.match(
                /\*\*Source:\*\*\s*Issue\s*#(\d+)/i
              );
              if (sourceMatch) {
                linkedIssueNumber = parseInt(sourceMatch[1]);
              }
            }

            // Also check PR title for issue reference
            if (!linkedIssueNumber) {
              const titleMatch = context.payload.pull_request.title.match(/#(\d+)/);
              if (titleMatch) {
                linkedIssueNumber = parseInt(titleMatch[1]);
              }
            }

            let originalIssueBody = '';
            let originalIssueTitle = '';

            if (linkedIssueNumber) {
              core.info(`Found linked issue #${linkedIssueNumber}`);
              try {
                const { data: issue } = await withRetry(
                  (client) => (client || github).rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: linkedIssueNumber
                }));
                originalIssueBody = issue.body || '';
                originalIssueTitle = issue.title || '';
                core.setOutput('original_issue_number', linkedIssueNumber);
                core.setOutput('original_issue_title', originalIssueTitle);
              } catch (error) {
                core.warning(`Could not fetch issue #${linkedIssueNumber}: ${error.message}`);
              }
            } else {
              core.warning('No linked issue found in PR body or title');
            }

            fs.writeFileSync('original_issue.txt', originalIssueBody);

            // --- Base-branch propagation ---
            // Carry the merged PR's base forward when it is NOT the default
            // branch (evaluation lanes such as eval/claude). Without this the
            // follow-up PR targets the default branch and the fix escapes the
            // lane it belongs to. The bridge reads this marker back.
            const prBaseRef = context.payload.pull_request.base?.ref || '';
            const repoDefaultBranch =
              context.payload.repository?.default_branch || '';
            const nonDefaultBase =
              prBaseRef && prBaseRef !== repoDefaultBranch ? prBaseRef : '';
            if (nonDefaultBase) {
              core.info(
                `PR base '${nonDefaultBase}' is non-default; follow-up will target it.`,
              );
            }
            core.setOutput('pr_base_ref', nonDefaultBase);

            // --- Chain depth tracking (P0) ---
            // Extract follow-up-depth from original issue body or PR body
            // Format: <!-- follow-up-depth: N -->
            let chainDepth = 0;
            const depthSources = [originalIssueBody, prBody];
            for (const source of depthSources) {
              const depthMatch = source.match(
                /<!--\s*follow-up-depth:\s*(\d+)\s*-->/
              );
              if (depthMatch) {
                const parsed = parseInt(depthMatch[1], 10);
                if (parsed > chainDepth) chainDepth = parsed;
              }
            }
            // Also check if issue has 'follow-up' label (depth at least 1)
            if (chainDepth === 0 && linkedIssueNumber) {
              try {
                const { data: issueData } = await withRetry(
                  (client) => (client || github).rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: linkedIssueNumber
                  })
                );
                const hasFollowUpLabel = (issueData.labels || []).some(
                  l => (typeof l === 'string' ? l : l.name) === 'follow-up'
                );
                if (hasFollowUpLabel) chainDepth = Math.max(chainDepth, 1);
              } catch (_) { /* best effort */ }
            }
            core.info(`Follow-up chain depth: ${chainDepth}`);
            core.setOutput('chain_depth', String(chainDepth));

            // Set outputs
            core.setOutput('has_original_issue', linkedIssueNumber ? 'true' : 'false');

      - name: Validate terminal verifier artifact
        id: terminal-artifact
        if: steps.check-merged.outputs.merged == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          from scripts.langchain.verifier_config import (
              artifact_from_verification_text,
              is_terminal_artifact,
          )

          verification_path = Path("verification_data.txt")
          raw = (
              verification_path.read_text(encoding="utf-8")
              if verification_path.exists()
              else ""
          )
          artifact = artifact_from_verification_text(raw)
          terminal = is_terminal_artifact(artifact)
          verdict = str(artifact.get("verdict") or "")
          reason = (
              "terminal verifier output"
              if terminal
              else "verifier output is partial or missing a terminal verdict"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"terminal={str(terminal).lower()}\n")
              handle.write(f"verdict={verdict}\n")
              handle.write(f"reason={reason}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Terminal verifier artifact gate\n\n")
              handle.write(f"- Terminal: `{str(terminal).lower()}`\n")
              if verdict:
                  handle.write(f"- Verdict: `{verdict}`\n")
              handle.write(f"- Reason: {reason}\n")
          PY

      - name: Apply needs-human for non-terminal verifier output
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LINKED_ISSUE: ${{ steps.collect.outputs.original_issue_number }}
          TERMINAL_REASON: ${{ steps.terminal-artifact.outputs.reason }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath =
              './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : { withRetry: (fn) => fn() };
            const { withRetry } = retryHelpers;

            const prNumber = context.payload.pull_request.number;
            const linkedIssue = process.env.LINKED_ISSUE;
            const reason = process.env.TERMINAL_REASON ||
              'Verifier output is partial or missing a terminal verdict.';
            const body = [
              '🛑 **Verifier follow-up paused: non-terminal verifier output**',
              '',
              reason,
              '',
              'The workflow did not create a follow-up issue because the verifier artifact ' +
                'is not complete enough to drive automation safely.',
            ].join('\n');

            await withRetry(() => github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['needs-human'],
            }));
            if (linkedIssue) {
              await withRetry(() => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(linkedIssue),
                labels: ['needs-human'],
              }));
            }
            await withRetry(() => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            }));

      - name: Check chain depth limit
        id: chain-check
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHAIN_DEPTH: ${{ steps.collect.outputs.chain_depth }}
          MAX_CHAIN_DEPTH: '2'
          LINKED_ISSUE: ${{ steps.collect.outputs.original_issue_number }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath =
              './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : { withRetry: (fn) => fn() };
            const { withRetry } = retryHelpers;

            const depth = parseInt(process.env.CHAIN_DEPTH || '0', 10);
            const maxDepth = parseInt(process.env.MAX_CHAIN_DEPTH || '2', 10);
            const prNumber = context.payload.pull_request.number;
            const linkedIssue = process.env.LINKED_ISSUE;

            if (depth >= maxDepth) {
              core.info(
                `Chain depth ${depth} >= max ${maxDepth}. ` +
                'Applying needs-human instead of creating follow-up.'
              );

              // Read verification data for the comment
              let verificationSummary = '';
              try {
                const raw = fs.readFileSync(
                  'verification_data.txt', 'utf8'
                );
                // Extract first 500 chars of concerns
                const concernsMatch = raw.match(
                  /### Concerns\s*\n([\s\S]*?)(?=###|##|$)/i
                );
                if (concernsMatch) {
                  verificationSummary = concernsMatch[1]
                    .trim().substring(0, 500);
                }
              } catch (_) { /* best effort */ }

              const comment = [
                '🛑 **Follow-up chain depth limit reached** ' +
                  `(depth ${depth}/${maxDepth})`,
                '',
                'This PR has been through multiple verification → ' +
                  'follow-up cycles. To prevent diminishing-returns ' +
                  'automation, `needs-human` has been applied instead ' +
                  'of creating another follow-up issue.',
                '',
                verificationSummary
                  ? '**Remaining verification concerns:**\n' +
                    verificationSummary
                  : '',
                '',
                '> A human should review whether the remaining ' +
                  'concerns warrant manual action or can be accepted.'
              ].filter(Boolean).join('\n');

              await withRetry(
                (client) => (client || github).rest.issues.createComment(
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: comment
                  }
                )
              );

              // Apply needs-human to the PR
              await withRetry(
                (client) => (client || github).rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['needs-human']
                })
              );

              // Also apply to linked issue if available
              if (linkedIssue) {
                try {
                  await withRetry(
                    (client) =>
                      (client || github).rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: parseInt(linkedIssue, 10),
                        labels: ['needs-human']
                      })
                  );
                } catch (_) { /* best effort */ }
              }

              // Remove trigger label
              try {
                await withRetry(
                  (client) =>
                    (client || github).rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      name: 'verify:create-new-pr'
                    })
                );
              } catch (_) { /* best effort */ }

              core.setOutput('exceeded', 'true');
              return;
            }

            core.info(
              `Chain depth ${depth} < max ${maxDepth}. ` +
              'Proceeding with follow-up creation.'
            );
            core.setOutput('exceeded', 'false');
            core.setOutput('next_depth', String(depth + 1));

      - name: Extract verdict via verdict_policy
        id: extract-verdict
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.langchain.verdict_extract \
            --summary-path verification_data.txt \
            --policy worst \
            --emit github

      - name: Apply needs-human from verdict policy
        id: verdict-needs-human
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LINKED_ISSUE: ${{ steps.collect.outputs.original_issue_number }}
          NEEDS_HUMAN_REASON: ${{ steps.extract-verdict.outputs.needs_human_reason }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath =
              './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : { withRetry: (fn) => fn() };
            const { withRetry } = retryHelpers;

            const prNumber = context.payload.pull_request.number;
            const linkedIssue = process.env.LINKED_ISSUE;
            const reason = process.env.NEEDS_HUMAN_REASON || '';

            const comment = [
              '🛑 **Verdict policy: needs-human**',
              '',
              'The deterministic verdict policy flagged this PR for ' +
                'human review due to a split verdict with low-confidence ' +
                'concerns.',
              '',
              reason ? `**Reason:** ${reason}` : '',
              '',
              '> A human should review whether the remaining ' +
                'concerns warrant manual action or can be accepted.'
            ].filter(Boolean).join('\n');

            await withRetry(
              (client) => (client || github).rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              })
            );

            await withRetry(
              (client) => (client || github).rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['needs-human']
              })
            );

            if (linkedIssue) {
              try {
                await withRetry(
                  (client) =>
                    (client || github).rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: parseInt(linkedIssue, 10),
                      labels: ['needs-human']
                    })
                );
              } catch (_) { /* best effort */ }
            }

      - name: Generate follow-up issue
        id: generate
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human != 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_STRANSKE: ${{ secrets.CLAUDE_API_STRANSKE }}
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          ORIGINAL_ISSUE_NUMBER: ${{ steps.collect.outputs.original_issue_number }}
          ORIGINAL_ISSUE_TITLE: ${{ steps.collect.outputs.original_issue_title }}
          PR_NUMBER: ${{ steps.check-merged.outputs.pr_number }}
          FOLLOW_UP_DEPTH: ${{ steps.chain-check.outputs.next_depth }}
          PR_BASE_REF: ${{ steps.collect.outputs.pr_base_ref }}
        run: |
          # Generate using Python script
          python scripts/langchain/followup_issue_generator.py \
            --verification-comment verification_data.txt \
            --original-issue original_issue.txt \
            --original-issue-number "${ORIGINAL_ISSUE_NUMBER:-0}" \
            --original-issue-title "${ORIGINAL_ISSUE_TITLE:-}" \
            --pr-number "${PR_NUMBER}" \
            --json \
            --output followup_issue.json

          # Inject chain depth marker into generated body
          depth="${FOLLOW_UP_DEPTH:-1}"
          marker="<!-- follow-up-depth: ${depth} -->"
          # Preserve a non-default base (evaluation lanes) so the follow-up PR
          # targets the same branch the originating PR merged into.
          if [ -n "${PR_BASE_REF:-}" ]; then
            marker="$(printf '%s\n%s' "$marker" "<!-- base-branch: ${PR_BASE_REF} -->")"
          fi
          jq --arg marker "$marker" \
            '.body = $marker + "\n" + .body' \
            followup_issue.json > followup_issue_tmp.json
          mv followup_issue_tmp.json followup_issue.json

          # Extract title and body for GitHub Actions
          echo "issue_title=$(jq -r '.title' followup_issue.json)" >> "$GITHUB_OUTPUT"

          # Use delimiter for multi-line body
          {
            echo 'issue_body<<EOF_ISSUE_BODY'
            jq -r '.body' followup_issue.json
            echo 'EOF_ISSUE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Fallback to simple extraction
        id: fallback
        if: >-
          steps.generate.outcome == 'failure' &&
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FOLLOW_UP_DEPTH: ${{ steps.chain-check.outputs.next_depth }}
          EXTRACTED_VERDICT: ${{ steps.extract-verdict.outputs.verdict }}
          PR_BASE_REF: ${{ steps.collect.outputs.pr_base_ref }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            // Fallback to structured extraction if Python script fails
            const fs = require('fs');
            const prBaseRef = process.env.PR_BASE_REF || '';
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;
            const depth = process.env.FOLLOW_UP_DEPTH || '1';

            let verificationText = '';
            try {
              verificationText = fs.readFileSync('verification_data.txt', 'utf8');
            } catch (error) {
              core.warning('Could not read verification data');
            }

            // --- Extract concerns from multiple formats ---
            const allConcerns = [];

            // Format 1: ### Concerns heading (verify:evaluate)
            const headingMatch = verificationText.match(
              /### Concerns\s*\n([\s\S]*?)(?=###|##|$)/i
            );
            if (headingMatch) {
              for (const line of headingMatch[1].split('\n')) {
                const t = line.trim().replace(/^[-*]\s*/, '');
                if (t && t.length > 15) allConcerns.push(t);
              }
            }

            // Format 2: - **Concerns:** bullet list (Provider Comparison Report)
            const bulletMatches = verificationText.matchAll(
              /- \*\*Concerns:\*\*\s*\n((?:\s+-\s+[^\n]+\n?)+)/g
            );
            for (const m of bulletMatches) {
              for (const line of m[1].split('\n')) {
                const t = line.trim().replace(/^-\s*/, '');
                if (t && t.length > 15) allConcerns.push(t);
              }
            }

            // Format 3: Unique Insights section
            const insightsMatch = verificationText.match(
              /### Unique Insights\s*\n([\s\S]*?)(?=\n##|\n---|\Z)/
            );
            if (insightsMatch) {
              for (const line of insightsMatch[1].split('\n')) {
                if (!line.trim().startsWith('-')) continue;
                // Remove "- provider: " prefix
                const content = line.trim().replace(
                  /^-\s*\w+(?:-\w+)?:\s*/, ''
                );
                for (const c of content.split(';')) {
                  const t = c.trim();
                  if (t && t.length > 15) allConcerns.push(t);
                }
              }
            }

            // Deduplicate concerns
            const seen = new Set();
            const concerns = [];
            for (const c of allConcerns) {
              const key = c.toLowerCase();
              if (!seen.has(key)) {
                seen.add(key);
                concerns.push(c);
              }
            }

            // --- Extract verdict ---
            // Prefer the deterministic extraction from verdict_policy.py
            let verdict = process.env.EXTRACTED_VERDICT || '';

            // Fall back to regex extraction only when the Python
            // entrypoint did not produce a result.
            if (!verdict || verdict === 'Unknown') {
              const tableMatch = verificationText.match(
                /\|\s*\w+\s*\|[^|]+\|\s*(FAIL|CONCERNS|PASS)\s*\|/i
              );
              if (tableMatch) {
                verdict = tableMatch[1].toUpperCase();
              }
            }

            if (!verdict || verdict === 'Unknown') {
              const boldMatch = verificationText.match(
                /\*\*Verdict:\*\*\s*(\w+)/i
              );
              if (boldMatch) verdict = boldMatch[1];
            }

            // Format 3: Plain Verdict: WORD
            if (verdict === 'Unknown') {
              const plainMatch = verificationText.match(
                /Verdict:\s*(\w+)/i
              );
              if (plainMatch) verdict = plainMatch[1];
            }

            // --- Extract low scores ---
            const scoreMatches = [
              ...verificationText.matchAll(/(\w+):\s*(\d+(?:\.\d+)?)\/10/gi)
            ];
            const lowScores = scoreMatches
              .filter(m => parseFloat(m[2]) < 7)
              .map(m => `- ${m[1]}: ${m[2]}/10`);

            // --- Build issue body ---
            const hasConcerns = concerns.length > 0;
            const taskItems = hasConcerns
              ? concerns.slice(0, 12).map(c => {
                  const prefix = /^(add|fix|implement|update|ensure|create|write)/i
                    .test(c) ? '' : 'Address: ';
                  return `- [ ] ${prefix}${c}`;
                }).join('\n')
              : '- [ ] No specific concerns extracted.';

            const lowScoreSection = lowScores.length > 0
              ? '\n## Implementation Notes\n\nLow scores to address:\n' +
                [...new Set(lowScores)].join('\n')
              : '';

            const issueBody = [
              `<!-- follow-up-depth: ${depth} -->`,
              ...(prBaseRef ? [`<!-- base-branch: ${prBaseRef} -->`] : []),
              '## Why',
              '',
              `PR #${prNumber} was verified with verdict **${verdict}**. ` +
              'This follow-up issue tracks the remaining concerns.',
              '',
              '## Scope',
              '',
              `Address verification concerns from [PR #${prNumber}](${prUrl}).`,
              '',
              '## Tasks',
              '',
              taskItems,
              '',
              '## Acceptance Criteria',
              '',
              '- [ ] All verification concerns addressed or documented',
              '- [ ] Tests updated if needed',
              '- [ ] Re-verification passes',
              lowScoreSection,
              '',
              '---',
              '*Auto-generated by verify-to-new-pr workflow (fallback mode)*'
            ].join('\n');

            core.setOutput(
              'issue_title',
              `[Follow-up] Address verification concerns from PR #${prNumber}`
            );

            // Use environment file for multi-line output
            const envFile = process.env.GITHUB_OUTPUT;
            const delimiter = 'EOF_BODY';
            fs.appendFileSync(
              envFile,
              `issue_body<<${delimiter}\n${issueBody}\n${delimiter}\n`
            );

      - name: Create follow-up issue
        id: create-issue
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_TITLE: >-
            ${{ steps.generate.outputs.issue_title ||
            steps.fallback.outputs.issue_title }}
          ISSUE_BODY: >-
            ${{ steps.generate.outputs.issue_body ||
            steps.fallback.outputs.issue_body }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry, paginateWithRetry } = retryHelpers;

            const title = process.env.ISSUE_TITLE;
            const body = process.env.ISSUE_BODY;
            const prNumber = context.payload.pull_request.number;

            if (!title || !body) {
              core.setFailed('Failed to generate issue title or body');
              return;
            }

            // Deduplication: check if a follow-up issue already exists
            const existing = await paginateWithRetry(
              github, github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'follow-up',
                per_page: 100
              }
            );
            const hasDuplicate = existing.some(issue =>
              issue.title.includes(`PR #${prNumber}`) &&
              issue.body && issue.body.includes(`PR #${prNumber}`)
            );
            if (hasDuplicate) {
              core.info(
                `Follow-up issue for PR #${prNumber} already exists, skipping`
              );
              // Set outputs so downstream steps don't fail
              const dup = existing.find(i =>
                i.title.includes(`PR #${prNumber}`)
              );
              core.setOutput('issue_number', dup.number);
              core.setOutput('issue_url', dup.html_url);
              return;
            }

            // Resolve agent from PR labels; fall back to registry default
            let _defaultAgent = 'codex';
            try {
              const { loadAgentRegistry } = require('./.github/scripts/agent_registry.js');
              _defaultAgent =
                loadAgentRegistry('./.github/agents/registry.yml').default_agent || 'codex';
            } catch (_) {}
            // Resolution order: the PR's own agent:* label, then the parent
            // issue's, then the registry default.
            //
            // The plain registry default is wrong for a follow-up: a follow-up
            // remediates ONE agent's work, so guessing sends another agent to fix
            // code it did not write and silently destroys per-agent attribution.
            // resolveAgentFromLabels throws when a PR carries zero or several
            // agent:* labels — which is exactly what stall rotation leaves behind —
            // so the old catch turned every such case into the default agent.
            const { resolveAgentFromLabels } = require('./.github/scripts/agent_registry.js');
            const registryPath = './.github/agents/registry.yml';
            const agentFrom = (labels) => {
              try {
                const key = resolveAgentFromLabels(labels || [], { registryPath });
                return key ? String(key).trim().toLowerCase() : '';
              } catch (_) {
                // Fall back to a single unambiguous agent:* label if present.
                const names = (labels || [])
                  .map((l) => (typeof l === 'string' ? l : l && l.name) || '')
                  .filter((n) => n.startsWith('agent:'))
                  .map((n) => n.slice('agent:'.length).trim().toLowerCase());
                const unique = [...new Set(names)];
                return unique.length === 1 ? unique[0] : '';
              }
            };

            let agentKey = agentFrom(
              (context.payload.pull_request && context.payload.pull_request.labels) || []);
            let agentSource = agentKey ? 'pr-label' : '';

            if (!agentKey) {
              // The PR body carries `<!-- meta:issue:N -->` / `Closes #N`; the
              // parent issue is the authoritative record of who was assigned.
              const prBody = String(
                (context.payload.pull_request && context.payload.pull_request.body) || '');
              const m = prBody.match(/<!--\s*meta:issue:(\d+)\s*-->/) ||
                        prBody.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/i);
              if (m) {
                try {
                  const { data: parent } = await withRetry((client) =>
                    (client || github).rest.issues.get({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: Number(m[1]),
                    }));
                  agentKey = agentFrom(parent.labels || []);
                  if (agentKey) agentSource = `parent-issue-#${m[1]}`;
                } catch (err) {
                  core.warning(`Could not read parent issue #${m[1]}: ${err.message}`);
                }
              }
            }

            if (!agentKey) {
              agentKey = _defaultAgent;
              agentSource = 'registry-default';
              core.warning(
                `Could not determine which agent produced this PR from its labels or its ` +
                `parent issue; falling back to '${_defaultAgent}'. The follow-up may be ` +
                `routed to an agent that did not write the code — check the label before ` +
                `letting it run.`);
            }
            core.info(`Follow-up agent: ${agentKey} (source: ${agentSource})`);
            const normalized =
              String(agentKey || _defaultAgent).trim().toLowerCase() || _defaultAgent;
            const agentLabel = `agent:${normalized}`;
            const fromLabel = `from:${normalized}`;

            const issue = await withRetry((client) => (client || github).rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [
                'follow-up',
                agentLabel,
                fromLabel,
                `runner:${normalized}`,
                'agents:auto-pilot',
              ]
            }));

            core.info(`Created issue #${issue.data.number}`);
            core.setOutput('issue_number', issue.data.number);
            core.setOutput('issue_url', issue.data.html_url);

      - name: Dispatch auto-pilot continuation
        id: dispatch-autopilot
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human != 'true' &&
          steps.create-issue.outputs.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const helperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(helperPath)
              ? require(helperPath)
              : { withRetry: (fn) => fn() };
            const { withRetry } = retryHelpers;

            const issueNumber = process.env.ISSUE_NUMBER;
            if (!issueNumber) {
              core.setFailed('Missing issue number; cannot dispatch auto-pilot.');
              return;
            }
            const ref = process.env.DEFAULT_BRANCH || 'main';
            await withRetry((client) => (client || github).rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agents-auto-pilot.yml',
              ref,
              inputs: {
                issue_number: String(issueNumber),
                force_step: 'optimize'
              }
            }));
            core.info(`Dispatched agents-auto-pilot for follow-up issue #${issueNumber}.`)

      - name: Comment on original PR
        if: >-
          steps.check-merged.outputs.merged == 'true' &&
          steps.terminal-artifact.outputs.terminal == 'true' &&
          steps.chain-check.outputs.exceeded != 'true' &&
          steps.extract-verdict.outputs.needs_human != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const issueNumber = process.env.ISSUE_NUMBER;
            const issueUrl = process.env.ISSUE_URL;

            const body = [
              '📋 **Follow-up issue created:** #' + issueNumber,
              '',
              'Verification concerns have been analyzed and structured into a follow-up issue.',
              '',
              '**Next steps:**',
              '1. Review the generated issue',
              '2. Auto-pilot will continue preparing a new PR',
              '',
              '> Or work on it manually - the choice is yours!'
            ].join('\n');

            await withRetry((client) => (client || github).rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            }));

      - name: Record terminal disposition
        if: always() && steps.check-merged.outputs.merged == 'true'
        env:
          ORIGINAL_ISSUE_NUMBER: ${{ steps.collect.outputs.original_issue_number }}
          ORIGINAL_ISSUE_TITLE: ${{ steps.collect.outputs.original_issue_title }}
          CHAIN_DEPTH: ${{ steps.collect.outputs.chain_depth }}
          MAX_CHAIN_DEPTH: '2'
          CHAIN_EXCEEDED: ${{ steps.chain-check.outputs.exceeded }}
          TERMINAL_ARTIFACT: ${{ steps.terminal-artifact.outputs.terminal }}
          TERMINAL_REASON: ${{ steps.terminal-artifact.outputs.reason }}
          NEEDS_HUMAN: ${{ steps.extract-verdict.outputs.needs_human }}
          NEEDS_HUMAN_REASON: ${{ steps.extract-verdict.outputs.needs_human_reason }}
          VERDICT: ${{ steps.extract-verdict.outputs.verdict }}
          FOLLOWUP_ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          FOLLOWUP_ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
          DISPATCH_AUTOPILOT_OUTCOME: ${{ steps.dispatch-autopilot.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {
              normalizeTerminalDisposition,
              normalizeVerifierFollowupLedger,
              formatTerminalDispositionMarkdown,
            } = require('./.github/scripts/terminal_disposition.js');

            const prNumber = context.payload.pull_request.number;
            const sourceIssue = process.env.ORIGINAL_ISSUE_NUMBER || '';
            const sourceType = sourceIssue ? 'source-issue' : 'merged-pr';
            const sourceId = sourceIssue || String(prNumber);

            const followupIssue = process.env.FOLLOWUP_ISSUE_NUMBER || '';
            const dispatchOutcome = (process.env.DISPATCH_AUTOPILOT_OUTCOME || '').trim();
            const chainDepth = Number.parseInt(process.env.CHAIN_DEPTH || '0', 10) || 0;
            const maxChainDepth = Number.parseInt(process.env.MAX_CHAIN_DEPTH || '2', 10) || 2;

            let disposition = 'follow-up-created';
            let reason = 'Verification follow-up issue was created.';
            let needsHuman = false;
            let policyAction = 'create-follow-up';
            let policyTrigger = 'verifier-concerns';
            let policyReason = 'Verifier concerns require another implementation pass.';

            if (process.env.TERMINAL_ARTIFACT !== 'true') {
              disposition = 'needs-human-non-terminal-verifier';
              reason = process.env.TERMINAL_REASON ||
                'Verifier output was partial or missing a terminal verdict.';
              needsHuman = true;
              policyAction = 'needs-human';
              policyTrigger = 'non-terminal-verifier-output';
              policyReason = reason;
            } else if (process.env.CHAIN_EXCEEDED === 'true') {
              disposition = 'needs-human-depth-limit';
              reason = 'Follow-up chain depth limit was reached.';
              needsHuman = true;
              policyAction = 'needs-human';
              policyTrigger = 'chain-depth-limit';
              policyReason = reason;
            } else if (process.env.NEEDS_HUMAN === 'true') {
              disposition = 'needs-human-verdict-policy';
              reason = process.env.NEEDS_HUMAN_REASON || 'Verdict policy requested human review.';
              needsHuman = true;
              policyAction = 'needs-human';
              policyTrigger = 'verdict-policy';
              policyReason = reason;
            } else if (!process.env.FOLLOWUP_ISSUE_NUMBER) {
              disposition = 'no-follow-up-created';
              reason = 'Workflow completed without a follow-up issue output.';
              policyAction = 'skip-follow-up';
              policyTrigger = 'missing-follow-up-output';
              policyReason = reason;
            } else if (dispatchOutcome === 'success') {
              reason = 'Verification follow-up issue was created and auto-pilot was dispatched.';
              policyReason = reason;
            } else if (dispatchOutcome === 'failure' || dispatchOutcome === 'cancelled') {
              reason =
                'Verification follow-up issue was created, but auto-pilot dispatch ' +
                `${dispatchOutcome}.`;
              policyReason = reason;
            } else if (dispatchOutcome === 'skipped') {
              reason = 'Verification follow-up issue was created; auto-pilot dispatch was skipped.';
              policyReason = reason;
            } else if (followupIssue) {
              reason =
                'Verification follow-up issue was created; auto-pilot dispatch status was ' +
                'not reported.';
              policyReason = reason;
            }

            const record = normalizeTerminalDisposition({
              source_type: sourceType,
              source_id: sourceId,
              source_title: process.env.ORIGINAL_ISSUE_TITLE || context.payload.pull_request.title,
              pr_number: prNumber,
              issue_number: sourceIssue || undefined,
              disposition,
              verdict: process.env.VERDICT || undefined,
              reason,
              needs_human: needsHuman,
              followup_issue_number: followupIssue || undefined,
              followup_issue_url: process.env.FOLLOWUP_ISSUE_URL || undefined,
              dispatch_outcome: dispatchOutcome || undefined,
              workflow: context.workflow,
              run_id: context.runId,
              run_attempt: context.runAttempt,
              artifact_name: `verifier-terminal-disposition-${context.runId}`,
              artifact_family: 'verifier-terminal-disposition',
              actor: context.actor,
            });

            fs.mkdirSync('agent-metrics', { recursive: true });
            fs.writeFileSync(
              'agent-metrics/verifier-terminal-disposition.ndjson',
              `${JSON.stringify(record)}\n`
            );

            let concernsHash = '';
            try {
              const raw = fs.readFileSync('verification_data.txt', 'utf8');
              if (raw.trim()) {
                concernsHash = crypto.createHash('sha256').update(raw).digest('hex');
              }
            } catch (_) { /* best effort */ }
            const ledgerRecord = normalizeVerifierFollowupLedger({
              pr_number: prNumber,
              verification_run_id: context.runId,
              verification_run_attempt: context.runAttempt,
              verdict: process.env.VERDICT || undefined,
              terminal_state: disposition,
              concerns_hash: concernsHash || undefined,
              followup_issue_number: followupIssue || undefined,
              followup_issue_url: process.env.FOLLOWUP_ISSUE_URL || undefined,
              source_issue_numbers: sourceIssue ? [sourceIssue] : [],
              chain_depth: chainDepth,
              followup_policy: {
                action: policyAction,
                trigger: policyTrigger,
                reason: policyReason,
                chain_depth: chainDepth,
                max_chain_depth: maxChainDepth,
                next_chain_depth: policyAction === 'create-follow-up' ? chainDepth + 1 : undefined,
                depth_limit_exceeded: process.env.CHAIN_EXCEEDED === 'true',
              },
              workflow: context.workflow,
              actor: context.actor,
              terminal_disposition_artifact: `verifier-terminal-disposition-${context.runId}`,
              dispatch_outcome: dispatchOutcome || undefined,
              needs_human: needsHuman,
            });
            fs.writeFileSync(
              'agent-metrics/verifier-followup-ledger.ndjson',
              `${JSON.stringify(ledgerRecord)}\n`
            );
            const markdown = formatTerminalDispositionMarkdown([record]);
            fs.writeFileSync('terminal-disposition-summary.md', `${markdown}\n`);
            await core.summary
              .addHeading('Terminal Disposition')
              .addRaw(markdown)
              .write();

      - name: Upload terminal disposition artifact
        if: always() && steps.check-merged.outputs.merged == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verifier-terminal-disposition-${{ github.run_id }}
          path: |
            agent-metrics/verifier-terminal-disposition.ndjson
            agent-metrics/verifier-followup-ledger.ndjson
            terminal-disposition-summary.md
          retention-days: 14

      - name: Remove trigger label
        if: steps.check-merged.outputs.merged == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        continue-on-error: true
        with:
          github-token: ${{ steps.select-token.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            try {
              await withRetry((client) => (client || github).rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'verify:create-new-pr'
              }));
              core.info('Removed verify:create-new-pr label');
            } catch (error) {
              core.warning('Could not remove label: ' + error.message);
            }
